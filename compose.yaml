services:
  app:
    build:
      context: .
      args:
        PHP_VERSION: "8.3"
        NODE_VERSION: 20-alpine
    image: real-estate-laravel:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REAL_ESTATE_APP_PORT:-8001}:8000"
    volumes:
      - application-storage:/var/www/html/storage/app
    environment:
      APP_NAME: ${APP_NAME:-Liberu Real Estate}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${REAL_ESTATE_DB_DATABASE:-real_estate}
      DB_USERNAME: ${REAL_ESTATE_DB_USERNAME:-real_estate}
      DB_PASSWORD: ${REAL_ESTATE_DB_PASSWORD:-local-development-password}
      RUNNING_MIGRATIONS: "true"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${REAL_ESTATE_DB_DATABASE:-real_estate}
      MYSQL_USER: ${REAL_ESTATE_DB_USERNAME:-real_estate}
      MYSQL_PASSWORD: ${REAL_ESTATE_DB_PASSWORD:-local-development-password}
      MYSQL_ROOT_PASSWORD: ${REAL_ESTATE_DB_ROOT_PASSWORD:-local-development-root-password}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  database-data:
  application-storage:
